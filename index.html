<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial;background:#79c7ff}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:white;text-shadow:2px 2px #000;pointer-events:none}.help{position:absolute;top:14px;left:14px;background:#0008;padding:10px;border-radius:6px;line-height:1.5}.pos{position:absolute;right:14px;top:14px;background:#0008;padding:8px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}.bar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}.slot{width:58px;height:58px;background:#555;border:3px solid #333;display:grid;place-items:center;font-size:26px}.slot.sel{border-color:white;background:#777}</style></head><body><canvas id="c"></canvas><div id="hud"><div class="help"><b>MINECRAFT</b><br>W / A / S / D or arrows: move<br>Space: jump<br>Left click: mine<br>Right click: place<br>1-6: select block<br>R: respawn</div><div class="pos" id="pos"></div><div class="cross">+</div><div class="bar" id="bar"></div></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W=0,H=0;function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();
const blocks=[['Grass','#55a832'],['Dirt','#8b5a32'],['Stone','#777'],['Wood','#76502e'],['Leaves','#32833a'],['Sand','#d8c17b']];const worldW=140,worldH=30,world=Array.from({length:worldW},()=>Array(worldH).fill(0));function noise(x){return Math.sin(x*12.9898)*43758.5453%1}function height(x){return Math.max(7,Math.min(18,Math.floor(12+Math.sin(x*.12)*2+Math.sin(x*.041)*3+noise(x)*2)))}for(let x=0;x<worldW;x++){let h=height(x);for(let y=0;y<=h;y++)world[x][y]=y===h?1:y>h-4?2:3}for(let x=8;x<worldW-8;x+=9){if(Math.abs(noise(x))<.25)continue;let h=height(x);for(let y=1;y<5;y++)if(h+y<worldH)world[x][h+y]=4;for(let dx=-2;dx<=2;dx++)for(let y=3;y<=5;y++){let xx=x+dx,yy=h+y;if(xx>=0&&xx<worldW&&world[xx][yy]===0)world[xx][yy]=5}}
let p={x:70.5,y:height(70),vy:0},spawn={x:p.x,y:p.y},cam={x:p.x,y:p.y},keys={},sel=0,inv=[99,99,99,99,99,99];addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key>='1'&&e.key<='6'){sel=+e.key-1;bar()}if(e.key.toLowerCase()==='r'){p.x=spawn.x;p.y=spawn.y;p.vy=0}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function ground(x){let xx=Math.max(0,Math.min(worldW-1,Math.floor(x)));for(let y=worldH-1;y>=0;y--)if(world[xx][y])return y;return 0}function solid(x,y){return x>=0&&x<worldW&&y>=0&&y<worldH&&world[Math.floor(x)][Math.floor(y)]!==0}function update(dt){let dx=0;if(keys.a||keys.arrowleft)dx-=1;if(keys.d||keys.arrowright)dx+=1;let nx=p.x+dx*6*dt;if(nx>.5&&nx<worldW-.5&&!solid(nx,p.y-.1)&&!solid(nx,p.y+.8))p.x=nx;p.vy-=24*dt;p.y+=p.vy*dt;let g=ground(p.x);if(p.y<=g){p.y=g;p.vy=0}if((keys[' ']||keys.w||keys.arrowup)&&p.y<=g+.01){p.vy=10;p.y+=.02}if(p.y<0||p.y>worldH+5){p.x=spawn.x;p.y=spawn.y;p.vy=0}cam.x+=(p.x-cam.x)*.15;cam.y+=(p.y-cam.y)*.15}
function sx(x){return W/2+(x-cam.x)*48}function sy(y){return H/2-(y-cam.y)*48}function draw(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#55a9e8');sky.addColorStop(1,'#d9efff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);let a=Math.floor(cam.x-W/96)-2,b=Math.ceil(cam.x+W/96)+2;for(let x=a;x<=b;x++)if(x>=0&&x<worldW)for(let y=worldH-1;y>=0;y--){let t=world[x][y];if(!t)continue;let X=sx(x),Y=sy(y);if(X<-48||X>W||Y<-48||Y>H)continue;ctx.fillStyle=blocks[t-1][1];ctx.fillRect(X,Y,48,48);if(t===1){ctx.fillStyle='#72bd42';ctx.fillRect(X,Y,48,7)}ctx.strokeStyle='#0003';ctx.strokeRect(X+.5,Y+.5,47,47)}ctx.fillStyle='#ffd65a';ctx.beginPath();ctx.arc(W*.82,H*.18,38,0,Math.PI*2);ctx.fill();document.getElementById('pos').textContent='X '+Math.floor(p.x)+'  Y '+Math.floor(p.y)}
let mouse={x:W/2,y:H/2};addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('mousedown',e=>{let tx=Math.floor(cam.x+(mouse.x-W/2)/48+.5),ty=Math.floor(cam.y-(mouse.y-H/2)/48);if(tx<0||tx>=worldW||ty<0||ty>=worldH)return;if(e.button===0&&world[tx][ty]){inv[world[tx][ty]-1]++;world[tx][ty]=0}else if(e.button===2&&world[tx][ty]===0&&inv[sel]>0){world[tx][ty]=sel+1;inv[sel]--}bar()});function bar(){document.getElementById('bar').innerHTML=blocks.map((b,i)=>`<div class="slot ${i===sel?'sel':''}" style="background:${b[1]}">${i+1}</div>`).join('')}bar();let last=performance.now();function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
