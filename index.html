<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft — Grid Engine</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font:14px system-ui}button{background:#252525;color:#fff;border:1px solid #666;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:16px}button:hover{background:#383838}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#090a0dcc;z-index:5}.panel{width:min(520px,92vw);padding:30px;border:1px solid #555;border-radius:16px;background:#191a1eee;text-align:center}.hidden{display:none!important}#hud{position:fixed;inset:0;pointer-events:none;z-index:2}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:2px;height:18px;left:8px}.cross:after{height:2px;width:18px;top:8px}#coords{position:absolute;left:15px;top:15px;text-shadow:0 2px 4px #000}#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);text-shadow:0 2px 4px #000;white-space:nowrap}</style></head><body><div id="hud"><div class="cross"></div><div id="coords">XYZ 0 3 7</div><div id="hint">WASD · SPACE · SHIFT · LMB/RMB · ESC</div></div><div id="start" class="overlay"><div class="panel"><h1>Minecraft — 3D Grid Engine</h1><p>Monochrome voxel world prototype.</p><button id="play">Play</button> <button id="settings">Settings</button></div></div><div id="pause" class="overlay hidden"><div class="panel"><h1>Paused</h1><button id="resume">Resume</button> <button id="reset">Reset World</button></div></div><div id="error" class="overlay hidden"><div class="panel"><h1>Engine Error</h1><p id="errorText"></p><button onclick="location.reload()">Reload</button></div></div><script>
(function(){'use strict';
const $=id=>document.getElementById(id);let started=false,paused=true,keys={},yaw=0,pitch=0,px=.5,py=3.7,pz=7.5,vy=0,last=performance.now();
function showError(e){$('errorText').textContent=String(e&&e.message||e);$('error').classList.remove('hidden')}
const canvas=document.createElement('canvas');canvas.width=innerWidth;canvas.height=innerHeight;canvas.style.cssText='position:fixed;inset:0;z-index:0';document.body.appendChild(canvas);const ctx=canvas.getContext('2d');
const blocks=new Set(),K=(x,y,z)=>x+','+y+','+z;const has=(x,y,z)=>blocks.has(K(x,y,z));const add=(x,y,z)=>blocks.add(K(x,y,z));const rem=(x,y,z)=>blocks.delete(K(x,y,z));
function makeWorld(){blocks.clear();for(let x=-18;x<=18;x++)for(let z=-18;z<=18;z++){let h=Math.max(0,Math.floor(1.5+Math.sin(x*.4)*.6+Math.cos(z*.32)*.6));for(let y=0;y<=h;y++)add(x,y,z)}}makeWorld();
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resize);
function play(){started=true;paused=false;$('start').classList.add('hidden');$('pause').classList.add('hidden');canvas.requestPointerLock?.()}$('play').onclick=play;$('resume').onclick=play;$('reset').onclick=()=>{makeWorld();px=.5;py=3.7;pz=7.5;paused=false;$('pause').classList.add('hidden');canvas.requestPointerLock?.()};$('settings').onclick=()=>alert('Settings will be expanded with FOV and sensitivity controls.');
canvas.onclick=()=>{if(started&&!paused)canvas.requestPointerLock?.()};document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas)return;yaw-=e.movementX*.002;pitch=Math.max(-1.45,Math.min(1.45,pitch-e.movementY*.002))});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape'&&started&&!paused){paused=true;$('pause').classList.remove('hidden');document.exitPointerLock?.()}});document.addEventListener('keyup',e=>keys[e.code]=false);
function collide(x,y,z){const r=.28;for(let ix=Math.floor(x-r);ix<=Math.floor(x+r);ix++)for(let iy=Math.floor(y);iy<=Math.floor(y+1.7);iy++)for(let iz=Math.floor(z-r);iz<=Math.floor(z+r);iz++)if(has(ix,iy,iz))return true;return false}
function rayBlock(){const dx=Math.cos(pitch)*Math.sin(yaw),dy=-Math.sin(pitch),dz=Math.cos(pitch)*Math.cos(yaw);let x=px,y=py+1.5,z=pz;for(let d=0;d<8;d+=.08){x+=dx*.08;y+=dy*.08;z+=dz*.08;let bx=Math.floor(x),by=Math.floor(y),bz=Math.floor(z);if(has(bx,by,bz))return {x:bx,y:by,z:bz,px:x-dx*.08,py:y-dy*.08,pz:z-dz*.08}}return null}
function act(button){if(!started||paused)return;const b=rayBlock();if(!b)return;if(button===0&&b.y>0)rem(b.x,b.y,b.z);if(button===2){const ax=Math.floor(b.px),ay=Math.floor(b.py),az=Math.floor(b.pz);if(!has(ax,ay,az)&&ay>=0)add(ax,ay,az)}}document.addEventListener('mousedown',e=>act(e.button));
function project(x,y,z){const dx=x-px,dz=z-pz,dy=y-(py+1.45),sy=Math.sin(yaw),cy=Math.cos(yaw),rx=dx*cy-dz*sy,rz=dx*sy+dz*cy,sp=Math.sin(pitch),cp=Math.cos(pitch),ry=dy*cp-rz*sp,rz2=dy*sp+rz*cp;if(rz2<=.1)return null;const f=Math.min(canvas.width,canvas.height)*.9;return [canvas.width/2+rx*f/rz2,canvas.height/2-ry*f/rz2,rz2]}
function draw(){ctx.fillStyle='#11151b';ctx.fillRect(0,0,canvas.width,canvas.height);let arr=[];for(const s of blocks){const [x,y,z]=s.split(',').map(Number),p=project(x,y,z);if(p)arr.push({x,y,z,d:p[2]})}arr.sort((a,b)=>b.d-a.d);ctx.strokeStyle='#777';ctx.lineWidth=1;for(const o of arr){const a=project(o.x,o.y,o.z),b=project(o.x+1,o.y,o.z),c=project(o.x,o.y+1,o.z),d=project(o.x,o.y,o.z+1);if(!a||!b||!c||!d)continue;const w=Math.abs(b[0]-a[0]),h=Math.abs(c[1]-a[1]);if(w<2||h<2)continue;ctx.strokeRect(Math.min(a[0],b[0]),Math.min(a[1],c[1]),w,h);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(d[0],d[1]);ctx.moveTo(b[0],b[1]);ctx.lineTo(project(o.x+1,o.y,o.z+1)?.[0]||b[0],project(o.x+1,o.y,o.z+1)?.[1]||b[1]);ctx.stroke()}}
function update(t){const dt=Math.min(.04,(t-last)/1000);last=t;if(started&&!paused){const sp=(keys.ShiftLeft||keys.ShiftRight)?7:4.5;let fx=Math.sin(yaw),fz=Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0),l=Math.hypot(mx,mz);if(l){mx/=l;mz/=l;let nx=px+(rx*mx+fx*mz)*sp*dt,nz=pz+(rz*mx+fz*mz)*sp*dt;if(!collide(nx,py,pz))px=nx;if(!collide(px,py,nz))pz=nz}vy-=18*dt;let ny=py+vy*dt;if(!collide(px,ny,pz))py=ny;else{if(vy<0&&keys.Space)vy=7.2;else vy=0}if(py<1.1){py=1.1;vy=0}$('coords').textContent='XYZ '+px.toFixed(1)+' '+py.toFixed(1)+' '+pz.toFixed(1)}draw();requestAnimationFrame(update)}requestAnimationFrame(update);
})();
</script></body></html>
