<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#74bff2;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;text-shadow:2px 2px #222;pointer-events:none}.help{position:absolute;top:14px;left:14px;padding:10px 13px;background:#0008;border-radius:6px;line-height:1.45}.pos{position:absolute;top:14px;right:14px;padding:8px 10px;background:#0008}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px}.bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}.slot{width:58px;height:58px;border:3px solid #333;display:grid;place-items:center;font-weight:bold}.slot.sel{border-color:#fff;box-shadow:0 0 0 2px #000}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="help"><b>MINECRAFT</b><br>WASD / arrows — move<br>Space — jump<br>Left click — mine<br>Right click — place<br>1–6 — select · R — respawn</div><div class="pos" id="pos"></div><div class="cross">+</div><div class="bar" id="bar"></div></div><script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');let W=innerWidth,H=innerHeight;function resize(){W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H}addEventListener('resize',resize);resize();
const TYPES=[['Grass','#59aa37'],['Dirt','#8b5b35'],['Stone','#777'],['Wood','#79512f'],['Leaves','#3c8d3d'],['Sand','#d9c17a']];
const WW=180,WH=32,world=Array.from({length:WW},()=>Array(WH).fill(0));
function noise(x){const v=Math.sin(x*127.1)*43758.5453;return v-Math.floor(v)}function terrain(x){return Math.max(5,Math.min(18,Math.floor(11+Math.sin(x*.11)*2+Math.sin(x*.037)*3+noise(x)*2)))}
for(let x=0;x<WW;x++){const top=terrain(x);for(let y=0;y<=top;y++)world[x][y]=y===top?1:y>=top-3?2:3}
for(let x=8;x<WW-8;x+=11){if(noise(x)<.32)continue;const top=terrain(x);for(let y=1;y<=4;y++)world[x][top+y]=4;for(let dx=-2;dx<=2;dx++)for(let y=3;y<=5;y++){const xx=x+dx,yy=top+y;if(xx>=0&&xx<WW&&yy<WH&&world[xx][yy]===0)world[xx][yy]=5}}
const player={x:90.5,y:terrain(90)+1,w:.58,h:1.8,vx:0,vy:0,onGround:false};const spawn={x:player.x,y:player.y};let camX=player.x,camY=player.y,selected=0;const inventory=[64,64,64,64,64,64],keys=new Set();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();if(e.key>='1'&&e.key<='6'){selected=Number(e.key)-1;renderBar()}if(k==='r')respawn()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function respawn(){player.x=spawn.x;player.y=spawn.y;player.vx=0;player.vy=0;player.onGround=false}
function solidCell(x,y){if(x<0||x>=WW||y<0)return true;if(y>=WH)return false;return world[Math.floor(x)][Math.floor(y)]!==0}
function hits(x,y){const left=x-player.w/2+0.03,right=x+player.w/2-0.03,bottom=y+0.03,top=y+player.h-0.03;return solidCell(left,bottom)||solidCell(right,bottom)||solidCell(left,top)||solidCell(right,top)}
function move(dt){let dir=0;if(keys.has('a')||keys.has('arrowleft'))dir--;if(keys.has('d')||keys.has('arrowright'))dir++;player.vx=dir*5.2;const nx=player.x+player.vx*dt;if(!hits(nx,player.y))player.x=nx;else player.vx=0;
player.vy-=25*dt;const ny=player.y+player.vy*dt;if(!hits(player.x,ny)){player.y=ny;player.onGround=false}else if(player.vy<0){player.y=Math.floor(player.y+0.01)+0.001;player.vy=0;player.onGround=true}else{player.y=Math.floor(player.y+player.h)-player.h-0.001;player.vy=0}
if((keys.has(' ')||keys.has('w')||keys.has('arrowup'))&&player.onGround){player.vy=10;player.onGround=false}if(player.y<-5||player.y>WH+5)respawn();camX+=(player.x-camX)*.18;camY+=(player.y-camY)*.18}
function sx(x){return W/2+(x-camX)*48}function sy(y){return H/2-(y-camY)*48}
function draw(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#57ace9');sky.addColorStop(1,'#d9efff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const first=Math.floor(camX-W/96)-2,last=Math.ceil(camX+W/96)+2;for(let x=first;x<=last;x++){if(x<0||x>=WW)continue;for(let y=WH-1;y>=0;y--){const t=world[x][y];if(!t)continue;const X=sx(x),Y=sy(y);if(X>W+48||X<-48||Y>H+48||Y<-48)continue;ctx.fillStyle=TYPES[t-1][1];ctx.fillRect(X,Y,48,48);if(t===1){ctx.fillStyle='#72bd43';ctx.fillRect(X,Y,48,7)}ctx.strokeStyle='#0003';ctx.strokeRect(X+.5,Y+.5,47,47)}}
// player
ctx.fillStyle='#3a3028';ctx.fillRect(sx(player.x-player.w/2),sy(player.y+player.h),player.w*48,player.h*48);ctx.fillStyle='#e2b17e';ctx.fillRect(sx(player.x-player.w/2+.06),sy(player.y+player.h-.55),player.w*48-.12*48,.55*48);ctx.fillStyle='#222';ctx.fillRect(sx(player.x-.18),sy(player.y+player.h-.38),.09*48,.09*48);ctx.fillRect(sx(player.x+.09),sy(player.y+player.h-.38),.09*48,.09*48);document.getElementById('pos').textContent=`X ${Math.floor(player.x)}  Y ${Math.floor(player.y)}`}
const mouse={x:W/2,y:H/2};addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('mousedown',e=>{const tx=Math.floor(camX+(mouse.x-W/2)/48),ty=Math.floor(camY-(mouse.y-H/2)/48);if(tx<0||tx>=WW||ty<0||ty>=WH)return;if(e.button===0&&world[tx][ty]){inventory[world[tx][ty]-1]++;world[tx][ty]=0}else if(e.button===2&&world[tx][ty]===0&&inventory[selected]>0){world[tx][ty]=selected+1;inventory[selected]--}renderBar()});
function renderBar(){const bar=document.getElementById('bar');bar.innerHTML='';TYPES.forEach((t,i)=>{const s=document.createElement('div');s.className='slot'+(i===selected?' sel':'');s.style.background=t[1];s.textContent=i+1;bar.appendChild(s)})}renderBar();let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.033);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
