<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minecraft — Joel Engelman</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#75b9ed;font-family:Arial,sans-serif;user-select:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:2px 2px #222}#cross{position:absolute;left:50%;top:50%;font-size:28px;transform:translate(-50%,-50%);font-weight:bold}#hotbar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:#222b;border:3px solid #111;pointer-events:auto}.slot{width:62px;height:62px;background:#555c;border:3px solid #888;position:relative;display:grid;place-items:center;font-size:27px}.slot.sel{border-color:#fff;background:#777}.num{position:absolute;top:2px;left:4px;font-size:12px}.count{position:absolute;right:4px;bottom:2px;font-size:13px}#help{position:absolute;top:15px;left:15px;background:#0008;padding:10px 13px;border-radius:5px;font-size:14px;line-height:1.55}#status{position:absolute;top:15px;right:15px;background:#0008;padding:9px 12px;border-radius:5px;font-size:13px}.blockIcon{width:32px;height:32px;border:2px solid #222;box-shadow:inset 4px 4px #ffffff22,inset -4px -4px #0003}
</style></head>
<body><canvas id="game"></canvas><div id="hud"><div id="help"><b>MINECRAFT</b><br>WASD / arrows — move<br>Mouse — look · Click — mine<br>Right click — place · 1–6 — select<br>Space — jump · R — respawn</div><div id="status"></div><div id="cross">+</div><div id="hotbar"></div></div>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');let W,H,dpr;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const TYPES=[null,{name:'Grass',col:'#65a83c',top:'#78bd45'},{name:'Dirt',col:'#8a5a32'},{name:'Stone',col:'#777'},{name:'Wood',col:'#79502f'},{name:'Leaves',col:'#3e8b38'},{name:'Sand',col:'#d7bd73'}];
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(/^\d$/.test(e.key)&&+e.key>=1&&+e.key<=6){selected=+e.key-1;drawBar()}if(e.key.toLowerCase()==='r')respawn()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let seed=Date.now(),selected=0,inv=[24,18,40,18,28,16];const size=90,world=[];function rand(n){let v=Math.sin(n*12.9898+seed*.001)*43758.5453;return v-Math.floor(v)}function height(z){return Math.max(6,Math.min(18,Math.floor(10+Math.sin(z*.16)*3+Math.sin(z*.047)*4+rand(z)*3)))}
for(let z=0;z<size;z++){world[z]=[];let h=height(z);for(let y=0;y<25;y++)world[z][y]=y>h?0:y===h?1:y>h-4?2:3}
// Trees grow above the surface and never replace the grass block.
for(let z=4;z<size-4;z+=7){let h=height(z);if(rand(z*2)>.42)continue;for(let yy=1;yy<=4;yy++)if(h+yy<25)world[z][h+yy]=4;for(let dz=-2;dz<=2;dz++)for(let yy=3;yy<=5;yy++){let zz=z+dz,y=h+yy;if(zz>=0&&zz<size&&y>=0&&y<25&&world[zz][y]===0&&rand(zz*8+y)>.18)world[zz][y]=5}}
function findSpawn(){// Find a clear grass-top column, not a tree/leaf column.
for(let z=8;z<size-8;z++){let h=height(z);if(world[z][h]===1&&world[z][h+1]===0&&world[z][h+2]===0)return{z:z+.5,y:h};}
let z=45,h=height(z);return{z:z+.5,y:h};}
let spawn=findSpawn(),p={z:spawn.z,y:spawn.y,vy:0,onGround:true},cam={z:p.z,y:p.y};
function respawn(){spawn=findSpawn();p.z=spawn.z;p.y=spawn.y;p.vy=0;p.onGround=true;cam.z=p.z;cam.y=p.y}
function blockAt(z,y){if(z<0||z>=size||y<0||y>=25)return 0;return world[z][y]||0}function solid(z,y){return blockAt(z,y)!==0}
function groundAt(z){let col=Math.max(0,Math.min(size-1,Math.floor(z)));for(let y=24;y>=0;y--)if(solid(col,y))return y;return -1}
function move(dt){let dz=0;if(keys.w||keys.arrowup)dz-=1;if(keys.s||keys.arrowdown)dz+=1;let speed=5,nz=p.z+dz*speed*dt;if(nz>=.3&&nz<size-.3){let nextCol=Math.floor(nz);let g=groundAt(nextCol);if(g>=0&&p.y<=g+1.05)p.z=nz}
let g=groundAt(p.z);p.vy-=22*dt;p.y+=p.vy*dt;if(g>=0&&p.y>=g){p.y=g;p.vy=0;p.onGround=true}else p.onGround=false;if((keys[' ']||keys.space)&&p.onGround){p.vy=9;p.onGround=false}if(p.y>27||g<0)respawn();cam.z+=(p.z-cam.z)*.15;cam.y+=(p.y-cam.y)*.15}
function screenY(y){return H/2-(y-cam.y)*48}function screenX(z){return W/2+(z-cam.z)*48}function drawBlock(z,y,t){let sx=screenX(z),sy=screenY(y);if(sx<-55||sx>W+55||sy<-60||sy>H+60)return;x.fillStyle=TYPES[t].col;x.fillRect(sx,sy,48,48);x.fillStyle=t===1?TYPES[t].top:TYPES[t].col;x.fillRect(sx,sy,48,8);x.fillStyle='#0002';x.fillRect(sx+44,sy,4,48);x.fillRect(sx,sy+44,48,4);x.strokeStyle='#0004';x.strokeRect(sx+.5,sy+.5,47,47)}
function draw(){let grd=x.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#64aee5');grd.addColorStop(.7,'#b8e0f4');grd.addColorStop(1,'#d7c890');x.fillStyle=grd;x.fillRect(0,0,W,H);let start=Math.floor(cam.z-W/96)-2,end=Math.ceil(cam.z+W/96)+2;for(let z=start;z<=end;z++)if(z>=0&&z<size)for(let y=24;y>=0;y--)if(world[z][y])drawBlock(z,y,world[z][y]);let sun=(Math.sin(Date.now()/25000)+1)/2;x.fillStyle=`rgba(255,235,150,${.15+sun*.25})`;x.beginPath();x.arc(W*.82,H*.18,45,0,7);x.fill();document.querySelector('#status').textContent=`Position ${Math.floor(p.z)}, ${Math.floor(p.y)} • surface ${groundAt(p.z)}`}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function target(){let z=Math.round(cam.z+(mouse.x-W/2)/48);let y=Math.floor(cam.y-(mouse.y-H/2)/48);return{z,y}}let mouse={x:W/2,y:H/2};addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('mousedown',e=>{let q=target();if(q.z<0||q.z>=size||q.y<0||q.y>=25)return;if(e.button===0&&world[q.z][q.y]){let t=world[q.z][q.y];world[q.z][q.y]=0;inv[t-1]++}else if(e.button===2&&world[q.z][q.y]===0&&inv[selected]>0){world[q.z][q.y]=selected+1;inv[selected]--}drawBar()});
function drawBar(){let b=document.querySelector('#hotbar');b.innerHTML='';for(let i=0;i<6;i++){let s=document.createElement('div');s.className='slot'+(i===selected?' sel':'');s.innerHTML=`<span class="num">${i+1}</span><div class="blockIcon" style="background:${TYPES[i+1].col}"></div><span class="count">${inv[i]}</span>`;s.onclick=()=>{selected=i;drawBar()};b.appendChild(s)}}drawBar();
</script></body></html>
