<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft — 3D Grid Engine</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font:14px system-ui}canvas{display:block}button{background:#252525;color:#fff;border:1px solid #666;border-radius:8px;padding:12px 18px;cursor:pointer;font-size:16px}button:hover{background:#383838}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#090a0dcc;z-index:10}.panel{width:min(540px,92vw);padding:30px;border:1px solid #555;border-radius:16px;background:#191a1eee;text-align:center}.hidden{display:none!important}.panel p{color:#bbb}.settings{display:grid;gap:12px;text-align:left;margin:20px 0}.settings label{display:flex;justify-content:space-between;gap:15px}.settings input{width:220px}#hud{position:fixed;inset:0;pointer-events:none;z-index:2}.cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);filter:drop-shadow(0 1px 2px #000)}.cross:before,.cross:after{content:"";position:absolute;background:#fff}.cross:before{width:2px;height:18px;left:8px}.cross:after{height:2px;width:18px;top:8px}#coords{position:absolute;left:15px;top:15px;text-shadow:0 2px 4px #000}#hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);text-shadow:0 2px 4px #000;white-space:nowrap}</style></head><body><div id="hud"><div class="cross"></div><div id="coords">XYZ 0 3 7</div><div id="hint">WASD move · SPACE jump · SHIFT sprint · Hold left click break · Right click place/interact · ESC pause</div></div><div id="start" class="overlay"><div class="panel"><h1>Minecraft — 3D Grid Engine</h1><p>Solid monochrome voxel world.</p><button id="play">Play</button> <button id="settingsBtn">Settings</button></div></div><div id="pause" class="overlay hidden"><div class="panel"><h1>Game Paused</h1><p>Press <b>ESC</b> or Resume to continue.</p><button id="resume">Resume</button> <button id="pauseSettings">Settings</button> <button id="reset">Reset World</button></div></div><div id="settings" class="overlay hidden"><div class="panel"><h1>Settings</h1><div class="settings"><label>Mouse sensitivity <input id="sens" type="range" min="0.5" max="2" step="0.1" value="1"></label><label>FOV <input id="fov" type="range" min="60" max="110" value="75"></label></div><button id="closeSettings">Done</button></div></div><script>(function(){'use strict';const $=id=>document.getElementById(id);let started=false,paused=true,keys=Object.create(null),yaw=0,pitch=0,px=.5,py=3.1,pz=7.5,vy=0,onGround=false,last=performance.now(),leftHeld=false,leftTimer=0,jumpQueued=false;const canvas=document.createElement('canvas');canvas.style.cssText='position:fixed;inset:0;z-index:0';canvas.width=innerWidth;canvas.height=innerHeight;document.body.appendChild(canvas);const ctx=canvas.getContext('2d');const blocks=new Set(),K=(x,y,z)=>x+','+y+','+z,has=(x,y,z)=>blocks.has(K(x,y,z));function add(x,y,z){blocks.add(K(x,y,z))}function rem(x,y,z){blocks.delete(K(x,y,z))}function makeWorld(){blocks.clear();for(let x=-18;x<=18;x++)for(let z=-18;z<=18;z++){const h=Math.max(0,Math.floor(1.5+Math.sin(x*.4)*.6+Math.cos(z*.32)*.6));for(let y=0;y<=h;y++)add(x,y,z)}}makeWorld();function resize(){canvas.width=innerWidth;canvas.height=innerHeight}addEventListener('resize',resize);function enterGame(){started=true;paused=false;$('start').classList.add('hidden');$('pause').classList.add('hidden');canvas.requestPointerLock?.()}function pauseGame(){if(!started)return;paused=true;$('pause').classList.remove('hidden');document.exitPointerLock?.()}function resumeGame(){if(!started)return;paused=false;$('pause').classList.add('hidden');canvas.requestPointerLock?.()}$('play').onclick=enterGame;$('resume').onclick=resumeGame;$('reset').onclick=()=>{makeWorld();px=.5;py=3.1;pz=7.5;vy=0;onGround=false;jumpQueued=false;resumeGame()};function openSettings(){$('settings').classList.remove('hidden');document.exitPointerLock?.()}function closeSettings(){$('settings').classList.add('hidden');if(started&&!paused)canvas.requestPointerLock?.()}$('settingsBtn').onclick=openSettings;$('pauseSettings').onclick=openSettings;$('closeSettings').onclick=closeSettings;canvas.onclick=()=>{if(started&&!paused)canvas.requestPointerLock?.()};document.addEventListener('pointerlockchange',()=>{if(started&&!paused&&document.pointerLockElement!==canvas)pauseGame()});document.addEventListener('mousemove',e=>{if(document.pointerLockElement!==canvas||paused)return;const s=Number($('sens').value)*.002;yaw-=e.movementX*s;pitch+=e.movementY*s;pitch=Math.max(-1.45,Math.min(1.45,pitch))});document.addEventListener('keydown',e=>{if(e.code==='Escape'){e.preventDefault();if(!$('settings').classList.contains('hidden')){closeSettings();return}if(started){if(paused)resumeGame();else pauseGame()}return}keys[e.code]=true;if(e.code==='Space'){e.preventDefault();jumpQueued=true}});document.addEventListener('keyup',e=>keys[e.code]=false);function playerHitsBlock(x,y,z){const r=.28;for(let ix=Math.floor(x-r);ix<=Math.floor(x+r);ix++)for(let iy=Math.floor(y+.001);iy<=Math.floor(y+1.8);iy++)for(let iz=Math.floor(z-r);iz<=Math.floor(z+r);iz++)if(has(ix,iy,iz))return true;return false}function groundBelow(){const feet=py;for(let ix=Math.floor(px-.28);ix<=Math.floor(px+.28);ix++)for(let iz=Math.floor(pz-.28);iz<=Math.floor(pz+.28);iz++)if(has(ix,Math.floor(feet-.08),iz))return true;return false}function rayBlock(){const dx=Math.cos(pitch)*Math.sin(yaw),dy=-Math.sin(pitch),dz=Math.cos(pitch)*Math.cos(yaw);let x=px,y=py+1.55,z=pz;for(let d=0;d<8;d+=.05){x+=dx*.05;y+=dy*.05;z+=dz*.05;const bx=Math.floor(x),by=Math.floor(y),bz=Math.floor(z);if(has(bx,by,bz))return{x:bx,y:by,z:bz,px:x-dx*.05,py:y-dy*.05,pz:z-dz*.05}}return null}function breakTarget(){const b=rayBlock();if(b&&b.y>0)rem(b.x,b.y,b.z)}function placeTarget(){const b=rayBlock();if(!b)return;const ax=Math.floor(b.px),ay=Math.floor(b.py),az=Math.floor(b.pz);if(ay>=0&&!has(ax,ay,az)&&!playerHitsBlock(ax+.5,ay,az+.5))add(ax,ay,az)}document.addEventListener('mousedown',e=>{if(!started||paused)return;if(e.button===0){leftHeld=true;breakTarget();leftTimer=.16}else if(e.button===2){e.preventDefault();placeTarget()}});document.addEventListener('mouseup',e=>{if(e.button===0)leftHeld=false});document.addEventListener('contextmenu',e=>{if(started)e.preventDefault()});function project(x,y,z){const dx=x-px,dz=z-pz,dy=y-(py+1.55),sy=Math.sin(yaw),cy=Math.cos(yaw),rx=dx*cy-dz*sy,rz=dx*sy+dz*cy,sp=Math.sin(pitch),cp=Math.cos(pitch),ry=dy*cp-rz*sp,rz2=dy*sp+rz*cp;if(rz2<=.08)return null;const f=Math.min(canvas.width,canvas.height)*.9;return[canvas.width/2+rx*f/rz2,canvas.height/2-ry*f/rz2,rz2]}function poly(points,fill){if(points.some(p=>!p))return;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill()}function draw(){ctx.fillStyle='#15181d';ctx.fillRect(0,0,canvas.width,canvas.height);const arr=[];for(const s of blocks){const[x,y,z]=s.split(',').map(Number),p=project(x+.5,y+.5,z+.5);if(p)arr.push({x,y,z,d:p[2]})}arr.sort((a,b)=>b.d-a.d);for(const o of arr){const v=[project(o.x,o.y,o.z),project(o.x+1,o.y,o.z),project(o.x+1,o.y,o.z+1),project(o.x,o.y,o.z+1),project(o.x,o.y+1,o.z),project(o.x+1,o.y+1,o.z),project(o.x+1,o.y+1,o.z+1),project(o.x,o.y+1,o.z+1)];if(v.some(p=>!p))continue;poly([v[0],v[1],v[2],v[3]],'#888d95');poly([v[4],v[5],v[6],v[7]],'#d5d8dc');poly([v[0],v[1],v[5],v[4]],'#b5bac1');poly([v[1],v[2],v[6],v[5]],'#9da3ab');poly([v[2],v[3],v[7],v[6]],'#858b94');poly([v[3],v[0],v[4],v[7]],'#a8adb5')}}function update(t){const dt=Math.min(.035,(t-last)/1000);last=t;if(started&&!paused){const speed=(keys.ShiftLeft||keys.ShiftRight)?7:4.5;let fx=Math.sin(yaw),fz=Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),mx=(keys.KeyD?1:0)-(keys.KeyA?1:0),mz=(keys.KeyW?1:0)-(keys.KeyS?1:0),l=Math.hypot(mx,mz);if(l){mx/=l;mz/=l;const nx=px+(rx*mx+fx*mz)*speed*dt,nz=pz+(rz*mx+fz*mz)*speed*dt;if(!playerHitsBlock(nx,py,pz))px=nx;if(!playerHitsBlock(px,py,nz))pz=nz}onGround=groundBelow();if(jumpQueued&&onGround){vy=7.4;onGround=false}jumpQueued=false;vy-=18*dt;const ny=py+vy*dt;if(!playerHitsBlock(px,ny,pz))py=ny;else{if(vy<0){py=Math.ceil(ny);onGround=true}vy=0}if(py<1.05){py=1.05;vy=0;onGround=true}if(leftHeld){leftTimer-=dt;if(leftTimer<=0){breakTarget();leftTimer=.16}}$('coords').textContent='XYZ '+px.toFixed(1)+' '+py.toFixed(1)+' '+pz.toFixed(1)}draw();requestAnimationFrame(update)}requestAnimationFrame(update)})();</script></body></html>
