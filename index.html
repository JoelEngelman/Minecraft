<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minecraft</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79c7ff;font-family:Arial}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;color:#fff;text-shadow:2px 2px #000;pointer-events:none}.help{position:absolute;top:14px;left:14px;background:#0008;padding:10px;border-radius:6px;line-height:1.5}.pos{position:absolute;right:14px;top:14px;background:#0008;padding:8px}.cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:28px}.bar{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:4px;pointer-events:auto}.slot{width:58px;height:58px;border:3px solid #333;display:grid;place-items:center;font-size:22px}.slot.sel{border-color:#fff}</style></head><body><canvas id="c"></canvas><div id="hud"><div class="help"><b>MINECRAFT</b><br>WASD / arrows: move<br>Space: jump<br>Left click: mine · Right click: place<br>1-6: select · R: respawn</div><div class="pos" id="pos"></div><div class="cross">+</div><div class="bar" id="bar"></div></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H;function resize(){W=innerWidth;H=innerHeight;c.width=W;c.height=H}addEventListener('resize',resize);resize();
const T=[['Grass','#55a832'],['Dirt','#8b5a32'],['Stone','#777'],['Wood','#76502e'],['Leaves','#32833a'],['Sand','#d8c17b']],WW=160,WH=32,world=Array.from({length:WW},()=>Array(WH).fill(0));function n(x){let v=Math.sin(x*91.7)*43758.5453;return v-Math.floor(v)}function h(x){return Math.max(6,Math.min(19,Math.floor(12+Math.sin(x*.12)*2+Math.sin(x*.043)*3+n(x)*2)))}for(let x=0;x<WW;x++){let y=h(x);for(let j=0;j<=y;j++)world[x][j]=j===y?1:j>y-4?2:3}for(let x=6;x<WW-6;x+=10){if(n(x)<.35)continue;let y=h(x);for(let j=1;j<=4;j++)world[x][y+j]=4;for(let dx=-2;dx<=2;dx++)for(let j=3;j<=5;j++)if(x+dx>=0&&x+dx<WW&&world[x+dx][y+j]===0)world[x+dx][y+j]=5}
const P={w:.55,h:1.8};let p={x:80.5,y:h(80)+.001,vx:0,vy:0,on:false},spawn={x:p.x,y:p.y},cam={x:p.x,y:p.y},keys={},selected=0,inv=[99,99,99,99,99,99];
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key>='1'&&e.key<='6'){selected=+e.key-1;bar()}if(e.key.toLowerCase()==='r')respawn()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function respawn(){p.x=spawn.x;p.y=spawn.y;p.vx=p.vy=0}function solidAt(x,y){if(x<0||x>=WW||y<0||y>=WH)return true;return world[Math.floor(x)][Math.floor(y)]!==0}function boxHits(x,y){let l=x-P.w/2,r=x+P.w/2-0.001,b=y+.02,t=y+P.h-.02;return solidAt(l,b)||solidAt(r,b)||solidAt(l,t)||solidAt(r,t)}function move(dt){let dir=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);p.vx=dir*5.5;let nx=p.x+p.vx*dt;if(!boxHits(nx,p.y))p.x=nx;else{let step=dir>0?1:-1;while(Math.abs(nx-p.x)>.001){nx=p.x+step*.01;if(boxHits(nx,p.y))break;p.x=nx;if(Math.abs(p.x-(p.x+dir*5.5*dt))<.01)break}}
p.vy-=24*dt;let ny=p.y+p.vy*dt;if(!boxHits(p.x,ny)){p.y=ny;p.on=false}else if(p.vy<0){let by=Math.floor(p.y);p.y=by;p.vy=0;p.on=true}else{p.y=Math.floor(p.y+P.h)-P.h;p.vy=0}
if((keys[' ']||keys.w||keys.arrowup)&&p.on){p.vy=10;p.on=false}if(p.y<-3||p.y>WH+5)respawn();cam.x+=(p.x-cam.x)*.18;cam.y+=(p.y-cam.y)*.18}
function X(x){return W/2+(x-cam.x)*48}function Y(y){return H/2-(y-cam.y)*48}function draw(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#55a9e8');sky.addColorStop(1,'#d9efff');g.fillStyle=sky;g.fillRect(0,0,W,H);let a=Math.floor(cam.x-W/96)-2,b=Math.ceil(cam.x+W/96)+2;for(let x=a;x<=b;x++)if(x>=0&&x<WW)for(let y=WH-1;y>=0;y--){let t=world[x][y];if(!t)continue;let xx=X(x),yy=Y(y);if(xx<-50||xx>W+50||yy<-50||yy>H+50)continue;g.fillStyle=T[t-1][1];g.fillRect(xx,yy,48,48);if(t===1){g.fillStyle='#72bd42';g.fillRect(xx,yy,48,7)}g.strokeStyle='#0003';g.strokeRect(xx+.5,yy+.5,47,47)}g.fillStyle='#3b2b20';g.fillRect(X(p.x-P.w/2),Y(p.y+P.h),P.w*48,P.h*48);document.getElementById('pos').textContent='X '+Math.floor(p.x)+' Y '+Math.floor(p.y)}
let mouse={x:W/2,y:H/2};addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});addEventListener('contextmenu',e=>e.preventDefault());c.addEventListener('mousedown',e=>{let tx=Math.floor(cam.x+(mouse.x-W/2)/48+.5),ty=Math.floor(cam.y-(mouse.y-H/2)/48);if(tx<0||tx>=WW||ty<0||ty>=WH)return;if(e.button===0&&world[tx][ty]){inv[world[tx][ty]-1]++;world[tx][ty]=0}else if(e.button===2&&world[tx][ty]===0){world[tx][ty]=selected+1;inv[selected]--}bar()});function bar(){document.getElementById('bar').innerHTML=T.map((t,i)=>`<div class="slot ${i===selected?'sel':''}" style="background:${t[1]}">${i+1}</div>`).join('')}bar();let last=performance.now();function loop(now){let dt=Math.min(.025,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
